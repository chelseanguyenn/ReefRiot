<svg id="svg-shark" width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <rect width="160" height="160" fill="#041218"/>
    <circle cx="80" cy="80" r="62" fill="#061c26" stroke="#00ffe022" stroke-width="1"/>
    <circle cx="80" cy="80" r="54" fill="none" stroke="#00ffe011" stroke-width="1"/>
    <!-- Dorsal fin -->
    <path d="M68 52 L80 18 L96 52 Z" fill="#0e4a60"/>
    <path d="M68 52 L80 18 L96 52" fill="none" stroke="#00ffe044" stroke-width="1"/>
    <!-- Body -->
    <ellipse cx="80" cy="88" rx="46" ry="28" fill="#0e4a60"/>
    <!-- Belly highlight -->
    <ellipse cx="80" cy="96" rx="28" ry="14" fill="#e8f4f0" opacity=".12"/>
    <!-- Accent stripe -->
    <path d="M36 86 Q58 78 80 80 Q102 82 122 86" stroke="#00ffe0" stroke-width="2" fill="none" opacity=".65"/>
    <!-- Pectoral fin -->
    <path d="M44 92 L22 110 L56 100 Z" fill="#0a3a50"/>
    <!-- Tail -->
    <path d="M126 88 L148 72 L148 106 Z" fill="#0a3a50"/>
    <!-- Eye -->
    <circle cx="52" cy="82" r="7" fill="#00ffe0"/>
    <circle cx="52" cy="82" r="4" fill="#020d10"/>
    <circle cx="50" cy="80" r="1.8" fill="#fff" opacity=".9"/>
    <!-- Determined brow — angry V shape -->
    <path d="M46 74 L52 78 L58 74" stroke="#020d10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Grin mouth -->
    <path d="M36 94 Q42 100 50 96 L50 100 Q42 106 36 100 Z" fill="#020d10"/>
    <path d="M38 94 Q43 99 50 97" stroke="#00ffe066" stroke-width="1" fill="none"/>
    <!-- Teeth -->
    <path d="M39 98 L41 94 L43 98 L45 94 L47 98 L49 94 L50 97" stroke="#e8f4f0" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity=".8"/>
    <!-- Glow ring -->
    <circle cx="80" cy="80" r="62" fill="none" stroke="#00ffe0" stroke-width="1" opacity=".18"/>
  </svg>