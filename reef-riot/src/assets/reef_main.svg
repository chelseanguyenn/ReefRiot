<svg id="svg-main" width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#062030"/>
        <stop offset="100%" stop-color="#030f18"/>
      </linearGradient>
    </defs>
    <rect width="160" height="160" fill="url(#waterG)"/>
    <!-- Light rays from surface -->
    <path d="M40 0 L50 60 L30 60 Z" fill="#1a6080" opacity=".07"/>
    <path d="M80 0 L95 70 L65 70 Z" fill="#1a6080" opacity=".09"/>
    <path d="M130 0 L145 55 L115 55 Z" fill="#1a6080" opacity=".06"/>
    <!-- Seafloor -->
    <path d="M0 126 Q30 118 60 122 Q90 126 120 120 Q145 115 160 120 L160 160 L0 160 Z" fill="#062018"/>
    <!-- Sand ripples -->
    <path d="M10 140 Q40 136 70 140 Q100 144 130 138" stroke="#0a2e18" stroke-width="1" fill="none" opacity=".6"/>
    <path d="M0 150 Q50 145 100 150 Q130 153 160 148" stroke="#0a2e18" stroke-width="1" fill="none" opacity=".4"/>
    <!-- Coral clusters — warm healthy colors -->
    <ellipse cx="20" cy="122" rx="10" ry="18" fill="#c04428" opacity=".85"/>
    <ellipse cx="14" cy="114" rx="5" ry="8" fill="#d05030"/>
    <ellipse cx="26" cy="112" rx="4" ry="7" fill="#b83c22"/>
    <ellipse cx="20" cy="108" rx="3" ry="5" fill="#e0603a"/>
    <!-- coral face — neutral/watchful -->
    <circle cx="20" cy="118" r="2.5" fill="#8a1800" opacity=".5"/>
    <!-- Brain coral -->
    <ellipse cx="62" cy="128" rx="14" ry="10" fill="#d4720a"/>
    <path d="M50 128 Q56 122 62 126 Q68 130 74 126" stroke="#a05008" stroke-width="1.5" fill="none"/>
    <path d="M52 132 Q58 128 64 130 Q70 127 74 130" stroke="#a05008" stroke-width="1.5" fill="none"/>
    <!-- Fan coral -->
    <line x1="118" y1="124" x2="118" y2="92" stroke="#0e6060" stroke-width="2"/>
    <ellipse cx="118" cy="98" rx="16" ry="22" fill="none" stroke="#0e8070" stroke-width="1.5"/>
    <ellipse cx="118" cy="98" rx="10" ry="14" fill="none" stroke="#0e8070" stroke-width="1" opacity=".5"/>
    <!-- Tube sponge -->
    <ellipse cx="148" cy="118" rx="5" ry="14" fill="#1a6088"/>
    <ellipse cx="142" cy="122" rx="4" ry="11" fill="#156078"/>
    <!-- Swimming fish (alert eyes, neutral expression) -->
    <ellipse cx="88" cy="72" rx="12" ry="6" fill="#e8a020"/>
    <path d="M100 72 L112 64 L112 80 Z" fill="#d09010"/>
    <!-- stripes -->
    <line x1="88" y1="66" x2="88" y2="78" stroke="#c07800" stroke-width="1.5"/>
    <line x1="93" y1="66" x2="93" y2="78" stroke="#c07800" stroke-width="1.5"/>
    <circle cx="78" cy="70" r="3" fill="#c07000"/>
    <circle cx="78" cy="70" r="1.5" fill="#040c0a"/>
    <circle cx="77" cy="69" r=".7" fill="#fff" opacity=".8"/>
    <!-- neutral mouth -->
    <path d="M75 73 Q77 74 79 73" stroke="#a06000" stroke-width="1" fill="none"/>
    <!-- Small fish school -->
    <ellipse cx="34" cy="56" rx="5" ry="3" fill="#1a7090" opacity=".7"/>
    <ellipse cx="44" cy="50" rx="5" ry="3" fill="#1a7090" opacity=".7"/>
    <ellipse cx="38" cy="44" rx="4" ry="2.5" fill="#1a7090" opacity=".6"/>
    <!-- Bubbles -->
    <circle cx="100" cy="50" r="2.5" fill="none" stroke="#ffffff18" stroke-width="1"/>
    <circle cx="106" cy="36" r="2" fill="none" stroke="#ffffff14" stroke-width="1"/>
    <circle cx="30" cy="32" r="3" fill="none" stroke="#ffffff12" stroke-width="1"/>
    <!-- Label tag -->
    <rect x="4" y="4" width="46" height="14" rx="2" fill="#1a708011"/>
    <text x="8" y="14" font-size="7" fill="#1a708088" font-family="monospace" letter-spacing="1">REEF</text>
  </svg>