<svg id="svg-corrupt" width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <rect width="160" height="160" fill="#06111a"/>
    <!-- Dark murky water layers -->
    <rect width="160" height="160" fill="#06111a"/>
    <rect y="100" width="160" height="60" fill="#040e14"/>
    <!-- Toxic fog bands -->
    <rect y="60" width="160" height="18" fill="#1a2a0a" opacity=".5"/>
    <rect y="82" width="160" height="14" fill="#1a2a0a" opacity=".3"/>
    <!-- Dead seafloor -->
    <path d="M0 128 Q20 122 40 126 Q60 130 80 124 Q100 118 120 124 Q140 130 160 122 L160 160 L0 160 Z" fill="#0a1a14"/>
    <!-- Dead bleached coral stumps -->
    <ellipse cx="24" cy="128" rx="8" ry="14" fill="#1a2820" stroke="#243828" stroke-width="1"/>
    <ellipse cx="20" cy="120" rx="4" ry="6" fill="#1a2820"/>
    <ellipse cx="28" cy="118" rx="3" ry="5" fill="#1a2820"/>
    <ellipse cx="60" cy="130" rx="10" ry="12" fill="#1e2e22" stroke="#243828" stroke-width="1"/>
    <ellipse cx="55" cy="124" rx="3" ry="5" fill="#162416"/>
    <ellipse cx="65" cy="122" rx="4" ry="7" fill="#162416"/>
    <ellipse cx="110" cy="128" rx="9" ry="13" fill="#1a2820"/>
    <ellipse cx="105" cy="120" rx="4" ry="6" fill="#162416"/>
    <ellipse cx="115" cy="119" rx="3" ry="5" fill="#162416"/>
    <ellipse cx="145" cy="132" rx="7" ry="10" fill="#1a2820"/>
    <!-- Machine silhouette — extraction drill -->
    <rect x="86" y="82" width="18" height="46" rx="2" fill="#0d1e14" stroke="#1a3020" stroke-width="1"/>
    <path d="M90 82 L95 68 L100 82 Z" fill="#0d1e14" stroke="#1a3020" stroke-width="1"/>
    <rect x="82" y="90" width="26" height="4" rx="1" fill="#0d2018"/>
    <rect x="82" y="100" width="26" height="4" rx="1" fill="#0d2018"/>
    <rect x="82" y="110" width="26" height="4" rx="1" fill="#0d2018"/>
    <!-- Toxic bubbles rising -->
    <circle cx="44" cy="108" r="3" fill="none" stroke="#1e4020" stroke-width="1" opacity=".7"/>
    <circle cx="38" cy="94" r="2" fill="none" stroke="#1e4020" stroke-width="1" opacity=".5"/>
    <circle cx="50" cy="80" r="4" fill="none" stroke="#1e4020" stroke-width="1" opacity=".4"/>
    <circle cx="120" cy="100" r="3" fill="none" stroke="#1e4020" stroke-width="1" opacity=".6"/>
    <circle cx="128" cy="84" r="2" fill="none" stroke="#1e4020" stroke-width="1" opacity=".4"/>
    <!-- Sad small fish (downturned mouth, drooping fin) -->
    <ellipse cx="72" cy="76" rx="9" ry="5" fill="#0d3040"/>
    <path d="M81 76 L90 70 L90 82 Z" fill="#0a2a38"/>
    <circle cx="65" cy="75" r="2.5" fill="#1a4050"/>
    <circle cx="65" cy="75" r="1.2" fill="#020d10"/>
    <!-- sad brow -->
    <path d="M62 72 Q65 74 68 72" stroke="#020d10" stroke-width="1.5" fill="none"/>
    <!-- sad mouth -->
    <path d="M63 78 Q65 76 67 78" stroke="#0a5060" stroke-width="1" fill="none"/>
    <!-- Glitch scanline overlays -->
    <rect y="30" width="160" height="2" fill="#ff2dff" opacity=".06"/>
    <rect y="55" width="160" height="1" fill="#ff2dff" opacity=".08"/>
    <rect y="90" width="160" height="2" fill="#ff2dff" opacity=".05"/>
    <!-- Toxic green tint overlay -->
    <rect width="160" height="160" fill="#0a2800" opacity=".18"/>
    <!-- Corrupt "X" eye on dead coral creature -->
    <text x="22" y="113" font-size="8" fill="#243828" font-family="monospace" text-anchor="middle">×</text>
    <text x="62" y="117" font-size="8" fill="#243828" font-family="monospace" text-anchor="middle">×</text>
    <!-- Label tag in image -->
    <rect x="4" y="4" width="58" height="14" rx="2" fill="#ff2dff11"/>
    <text x="8" y="14" font-size="7" fill="#ff2dff88" font-family="monospace" letter-spacing="1">CORRUPTED</text>
  </svg>